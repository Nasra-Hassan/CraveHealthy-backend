services:
  db:
    image: postgres:16
    container_name: cravehealthy-db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - cravehealthy-network

  web:
    build: .
    container_name: cravehealthy-backend
    restart: unless-stopped
    env_file:
      - .env
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
    networks:
      - cravehealthy-network

volumes:
  postgres_data:

networks:
  cravehealthy-network:
    external: true